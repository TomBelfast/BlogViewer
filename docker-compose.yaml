services:
  blogbowl_app:
    container_name: blogbowl_app
    image: blogbowl/blogbowl
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - blogbowl_storage:/rails/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  blogbowl_sidekiq:
    container_name: blogbowl_sidekiq
    command: [ "bundle", "exec", "sidekiq" ]
    image: blogbowl/blogbowl:latest
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: blogbowl-postgres-1
    environment:
      POSTGRES_DB: blogbowl
      POSTGRES_USER: blogbowl
      # Do not forget to generate a new password for production environment
      POSTGRES_PASSWORD: blogbowl
    volumes:
      - /mnt/data/blogbowl/postgres:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 128M

  redis:
    image: redis:latest
    container_name: blogbowl-redis-1
    command: redis-server --appendonly yes
    volumes:
      - /mnt/data/blogbowl/redis:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 128M

volumes:
  blogbowl_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/blogbowl/storage
